# Preparation template: connect to a separately provisioned, authenticated replica set.
name: smart-hms-production
services:
  app:
    build: .
    image: smart-hms:0.10.0
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: '4000'
      BIND_HOST: 0.0.0.0
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:4000:4000'
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
