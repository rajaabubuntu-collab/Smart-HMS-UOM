name: smart-hms-week1
services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval ''try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]}); quit(1); }'''
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
volumes:
  mongo_data:
